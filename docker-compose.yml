# Developer Interface on one server with Docker.
# Set up with ./install.sh (it writes .env with fresh secrets), then: docker compose up -d
# Guide: INSTALL.md
name: developerinterface

services:
  # Developer Interface itself: the website and the API, on port 8080 inside.
  app:
    image: ${DI_IMAGE:-ghcr.io/lotfy2125/developerinterface}:${DI_VERSION:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      DI_MODE: app
      PORT: "8080"
      DB_URL: jdbc:mysql://db:3306/developerinterface?serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: developerinterface
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      APP_URL: ${APP_URL:?Set APP_URL in .env}
      DI_DATA_DIR: /data
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      # This install's marker (part of its Activation ID).
      - app-data:/data
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: developerinterface
      MYSQL_USER: developerinterface
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 30

  # HTTPS at a DNS name (./install.sh --domain): certificates from Let's Encrypt, renewed by themselves.
  caddy:
    image: caddy:2
    profiles: ["https"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  app-data:
  db-data:
  caddy-data:
  caddy-config:
